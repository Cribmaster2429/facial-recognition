version: "3.8"

services:
  facial-recognition:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facial-recognition-api
    ports:
      - "8000:8000"
    volumes:
      - facial-data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/faces.db
      - DETECTION_MODEL=hog
      - ENCODING_MODEL=large
      - TOLERANCE=0.6
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  facial-data:
    driver: local
